# Tests and vets the hook binary sources on every PR and push to main.

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./cli/

      - name: Test
        run: make test

      - name: Bootstrap script syntax
        run: sh -n hooks/trustguard-hook.sh

      - name: hooks.json installer
        run: |
          python3 scripts/install-hooks.py install hooks "$RUNNER_TEMP/hooks.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1]))['hooks']; assert len(d)==7, list(d)" "$RUNNER_TEMP/hooks.json"
